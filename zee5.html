<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ZEE5 Predict · Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link id="brand-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<style>
/* ==========================================================================
   Design tokens. Colors are overwritten at runtime from CONFIG.brand.colors
   in the script below — edit the BRAND block, not these values.
   ========================================================================== */
:root {
  --brand:        #0407FF;
  --brand-dark:   #0305CC;
  --brand-light:  #5456FF;
  --brand-tint:   #F4F4FF;
  --brand-on:     #FFFFFF;
  /* Fill vs ink. --brand paints surfaces (buttons, active pills) and carries
     --brand-on as its label. --brand-ink is the same identity used as TEXT or
     a CHART LINE, where a light brand color (a yellow, a cyan) would be
     unreadable on a light page. Brands with a dark primary set both alike. */
  --brand-ink:    #0407FF;

  --n-900: #0B0E14;
  --n-800: #11171D;
  --n-700: #202C37;
  --n-600: #394960;
  --n-500: #62768A;
  --n-400: #99ADBD;
  --n-300: #C4D0D9;
  --n-250: #E5EBF5;
  --n-200: #ECEFF2;
  --n-150: #F3F5F7;
  --n-100: #F9FAFB;
  --n-0:   #FFFFFF;

  /* -700 is the TEXT shade (on its own -150 tint and on the page), -150 is the
     button/tag fill, -200 is the hover and order-book depth bar. Every pair
     here is measured; see the contrast checks in verify.js. */
  --ok-700: #065F46;
  --ok-500: #10B981;
  --ok-200: #6EE7B7;
  --ok-150: #A7F3D0;
  --ok-100: #E3FBF0;

  --no-700: #961616;
  --no-600: #DC2626;
  --no-500: #EF4444;
  --no-200: #FCA5A5;
  --no-150: #FDBDBD;

  --warn-500: #F59E0B;
  --warn-150: #FFF5CC;

  --radius:    12px;
  --radius-lg: 16px;
  --shadow-card: 0 1px 2px rgba(15,23,42,.04);
  --shadow-pop:  0 10px 30px rgba(15,23,42,.08);
  --shadow-lift: 0 12px 34px rgba(15,23,42,.12);

  --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --page-max: 1240px;

  /* Chrome heights. The nav sticks below the mockup bar, so the offset is
     derived from these rather than restated as a magic number that drifts
     when a breakpoint changes one of them. */
  --mockbar-h: 40px;
  --nav-h: 64px;

  /* The assistant's avatar disc. Its own identity rather than the venue's,
     the way the real dock carries Truman's mark inside a partner's page.
     Overridden from CONFIG.brand.assistant.avatar. */
  --ai-from: #001F4D;
  --ai-to:   #0A3170;
  /* The dock's own surface, a step away from the cards on the page so it
     reads as floating over them rather than sitting among them. Light is
     already at the top of the ramp, so there the separation is carried by the
     backdrop instead. Both are set per theme in applyTheme. */
  --ai-surface: #FFFFFF;
  --ai-scrim: rgba(15, 23, 42, .18);
  --ai-lift: 0 0 0 1px rgba(15, 23, 42, .05), 0 6px 14px -4px rgba(15, 23, 42, .20), 0 24px 50px -18px rgba(15, 23, 42, .40);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--n-150);
  color: var(--n-800);
  -webkit-font-smoothing: antialiased;
}
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
a { color: inherit; text-decoration: none; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- mockup chrome (hidden with ?clean=1) --------------------------- */
.mockbar {
  position: sticky; top: 0; z-index: 200;
  display: flex; align-items: center; gap: 14px;
  height: var(--mockbar-h); padding: 0 16px;
  background: #10151c; color: #d7dee8;
  font-size: 12px;
}
.mockbar__label { font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #6f8299; font-size: 10px; }
.mockbar__tabs { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.mockbar__tabs::-webkit-scrollbar { display: none; }
.mockbar__tab { flex: none; white-space: nowrap; color: #9fb0c4; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; transition: background .15s, color .15s; }
.mockbar__tab:hover { background: rgba(255,255,255,.06); color: #fff; }
.mockbar__tab.is-active { background: var(--brand); color: var(--brand-on); }
.mockbar__hint { margin-left: auto; color: #6f8299; font-size: 11px; }
.mockbar__hint code { background: rgba(255,255,255,.08); padding: 1px 5px; border-radius: 4px; }
body.is-clean .mockbar { display: none; }

/* ---------- app shell ------------------------------------------------------ */
.wrap { max-width: var(--page-max); margin: 0 auto; padding: 0 20px; }

.nav { background: var(--n-0); border-bottom: 1px solid var(--n-200); position: sticky; top: 0; z-index: 110; }
body:not(.is-clean) .nav { top: var(--mockbar-h); }
.nav__inner { display: flex; align-items: center; gap: 28px; height: var(--nav-h); }
.brandmark { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.brandmark__glyph {
  width: 30px; height: 30px; border-radius: 9px;
  display: grid; place-items: center;
  background: var(--brand); color: var(--brand-on);
  font-weight: 800; font-size: 13px; letter-spacing: -.02em; overflow: hidden;
}
.brandmark__glyph svg { width: 100%; height: 100%; display: block; }
.brandmark__lockup { height: 30px; display: flex; align-items: center; color: var(--n-800); }
.brandmark__lockup svg { height: 30px; width: auto; display: block; }
.brandmark__product { font-size: 12px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--brand-ink); padding: 3px 8px; border-radius: 5px; background: var(--brand-tint); }
.brandmark__text { font-size: 16px; font-weight: 700; letter-spacing: -.015em; color: var(--n-800); }
.brandmark__text em { font-style: normal; color: var(--brand-ink); }
.nav__links { display: flex; gap: 4px; }
.nav__link { padding: 7px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; color: var(--n-600); transition: background .15s, color .15s; }
.nav__link:hover { background: var(--n-150); color: var(--n-800); }
.nav__link.is-active { color: var(--brand-ink); background: var(--brand-tint); font-weight: 600; }
.nav__right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.nav__balance { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.2; padding-right: 12px; border-right: 1px solid var(--n-200); }
.nav__balance b { font-size: 14px; font-weight: 700; color: var(--n-800); }
.themetoggle { display: flex; align-items: center; gap: 2px; background: var(--n-150); border: 1px solid var(--n-200); border-radius: 999px; padding: 3px; }
.themetoggle button { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 999px; color: var(--n-500); transition: background .15s, color .15s; }
.themetoggle button:hover { color: var(--n-800); }
.themetoggle button.is-active { background: var(--n-0); color: var(--brand-ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.themetoggle svg { width: 15px; height: 15px; }
.nav__burger { display: none; place-items: center; width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--n-200); background: var(--n-0); color: var(--n-700); }
.nav__burger:hover { background: var(--n-150); color: var(--n-800); }
.nav__burger svg { width: 19px; height: 19px; }
.nav__burger .is-close { display: none; }
body.nav-open .nav__burger { background: var(--n-150); color: var(--n-800); }
body.nav-open .nav__burger .is-open { display: none; }
body.nav-open .nav__burger .is-close { display: block; }
.nav__balance span { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--n-500); }

/* ---------- buttons -------------------------------------------------------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 999px; font-size: 14px; font-weight: 600; padding: 9px 18px; transition: background .15s, color .15s, transform .1s; }
.btn:active { transform: scale(.975); }
.btn--brand { background: var(--brand); color: var(--brand-on); }
.btn--brand:hover { background: var(--brand-dark); }
.btn--ghost { background: var(--n-200); color: var(--n-800); }
.btn--ghost:hover { background: var(--n-300); }
.btn--outline { border: 1px solid var(--n-300); color: var(--n-700); background: var(--n-0); }
.btn--outline:hover { background: var(--n-100); }
.btn--block { width: 100%; min-height: 48px; font-size: 15px; }
.btn--yes { background: var(--ok-150); color: var(--ok-700); }
.btn--yes:hover { background: var(--ok-200); }
.btn--no { background: var(--no-150); color: var(--no-700); }
.btn--no:hover { background: var(--no-200); }

/* ---------- primitives ----------------------------------------------------- */
.card { background: var(--n-0); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
.eyebrow { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--n-500); }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 7px 15px; font-size: 13px; font-weight: 600; }
.pill--brand { background: color-mix(in srgb, var(--brand-ink) 12%, transparent); color: var(--brand-ink); }
.pill--neutral { background: var(--n-200); color: var(--n-800); }
.pill--muted { background: var(--n-200); color: var(--n-500); font-weight: 500; }
.badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 3px 9px; font-size: 10px; font-weight: 700; }
.badge--new { background: var(--ok-200); color: var(--ok-700); }
.badge--soon { background: var(--n-200); color: var(--n-600); }
.badge--resolved { background: var(--n-200); color: var(--n-600); }
.delta--up { color: var(--ok-700); }
.delta--down { color: var(--no-700); }
.divider { height: 1px; background: var(--n-200); }

.logo-chip { width: 40px; height: 40px; border-radius: 11px; flex: none; display: grid; place-items: center; background: var(--n-200); color: var(--n-700); font-weight: 700; font-size: 15px; letter-spacing: -.02em; outline: 1px solid rgba(0,0,0,.05); }
.logo-chip--lg { width: 52px; height: 52px; border-radius: 14px; font-size: 19px; }
.logo-chip--sm { width: 32px; height: 32px; border-radius: 9px; font-size: 12px; }

/* ---------- discovery ------------------------------------------------------ */
.disco { padding: 32px 0 128px; }
.hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: 32px; padding: 28px; margin-bottom: 32px; border-radius: 20px; background: var(--n-0); box-shadow: var(--shadow-card); }
.hero__eyebrow { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
.hero__title { font-size: 30px; line-height: 1.2; font-weight: 700; letter-spacing: -.02em; margin: 0 0 10px; color: var(--n-800); }
.hero__sub { font-size: 15px; line-height: 1.55; color: var(--n-600); margin: 0 0 20px; }
.hero__stats { display: flex; gap: 28px; margin-bottom: 22px; }
.hero__stat b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.02em; color: var(--n-800); }
.hero__stat span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--n-500); }
.hero__cta { display: flex; gap: 10px; }
.hero__panel { background: var(--n-100); border: 1px solid var(--n-200); border-radius: var(--radius-lg); padding: 18px; display: flex; flex-direction: column; }
.hero__panelhead { display: flex; align-items: flex-start; gap: 11px; margin-bottom: 16px; }
.hero__panelhead p { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.35; color: var(--n-800); }
.hero__panelhead small { display: block; margin-top: 3px; font-size: 11px; font-weight: 500; color: var(--n-500); }

.controls { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
.pills { display: flex; gap: 7px; flex-wrap: wrap; }
.pillbtn { padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--n-600); background: var(--n-0); border: 1px solid var(--n-200); transition: all .15s; }
.pillbtn:hover { border-color: var(--n-300); color: var(--n-800); }
.pillbtn.is-active { background: var(--brand); border-color: var(--brand); color: var(--brand-on); }
.search { margin-left: auto; display: flex; align-items: center; gap: 8px; background: var(--n-0); border: 1px solid var(--n-200); border-radius: 999px; padding: 8px 16px; min-width: 230px; color: var(--n-400); font-size: 13px; }

.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
.mcard { display: flex; flex-direction: column; gap: 14px; background: var(--n-0); border: 1px solid var(--n-200); border-radius: 18px; padding: 20px; transition: transform .2s, box-shadow .2s; }
.mcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.mcard__head { display: flex; align-items: flex-start; gap: 11px; }
.mcard__q { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.4; color: var(--n-800); margin: 0; }
.mcard__row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.mcard__stat { display: flex; flex-direction: column; gap: 6px; }
.mcard__foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid var(--n-200); padding-top: 12px; font-size: 12px; font-weight: 500; color: var(--n-500); }

.dist { display: flex; align-items: flex-end; gap: 3px; height: 52px; }
.dist__bar { flex: 1; border-radius: 4px 4px 2px 2px; background: color-mix(in srgb, var(--brand-ink) 22%, var(--n-200)); min-height: 4px; position: relative; }
.dist__bar.is-lead { background: var(--brand-ink); }
.dist--lg { height: 118px; gap: 6px; }
.dist--lg .dist__bar { border-radius: 6px 6px 3px 3px; }
.distlabels { display: flex; gap: 6px; margin-top: 8px; }
.distlabels span { flex: 1; text-align: center; font-size: 10px; font-weight: 600; color: var(--n-500); font-variant-numeric: tabular-nums; }
.distlabels span.is-lead { color: var(--brand-ink); }

/* ---------- market detail -------------------------------------------------- */
.detail { padding: 28px 0 128px; }
.detail__cols { display: grid; grid-template-columns: minmax(0,1fr) 372px; gap: 28px; align-items: start; }
.mhead { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
.mhead__title { margin: 0 0 5px; font-size: 24px; font-weight: 700; letter-spacing: -.02em; color: var(--n-800); }
.mhead__q { margin: 0; font-size: 15px; line-height: 1.5; color: var(--n-600); max-width: 62ch; }
.mhead__meta { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; border: 1px solid var(--n-200); background: var(--n-0); padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--n-600); }
.chip.is-active { border-color: var(--brand-ink); color: var(--brand-ink); background: var(--brand-tint); }

.chartcard { padding: 20px; margin-bottom: 26px; }
.chartcard__top { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 6px; }
.metrics { display: flex; gap: 26px; }
.metric b { display: block; font-size: 18px; font-weight: 700; letter-spacing: -.01em; color: var(--n-800); }
.metric span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--n-500); }
.ranges { display: flex; gap: 2px; background: var(--n-200); border-radius: 999px; padding: 3px; }
.ranges button { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--n-600); }
.ranges button.is-active { background: var(--n-0); color: var(--n-800); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.chartwrap { position: relative; margin: 14px 0 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; padding-top: 12px; border-top: 1px solid var(--n-200); }
.legend__item { display: flex; align-items: center; gap: 7px; font-size: 12px; font-weight: 500; color: var(--n-600); }
.legend__dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.legend__val { font-weight: 700; color: var(--n-800); font-variant-numeric: tabular-nums; }

.sechead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sechead h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--n-800); }
.sechead span { font-size: 13px; font-weight: 600; color: var(--n-500); }

.ocard { background: var(--n-0); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; transition: background .2s; }
.ocard:hover { background: var(--n-100); }
.ocard.is-open { background: var(--n-100); box-shadow: var(--shadow-pop); }
.ocard__main { display: flex; align-items: center; gap: 16px; }
.ocard__label { width: 31%; flex: none; font-size: 16px; font-weight: 600; color: var(--n-800); }
.ocard__chance { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; }
.ocard__chance b { font-size: 18px; font-weight: 700; color: var(--n-800); font-variant-numeric: tabular-nums; }
.ocard__chance small { font-size: 12px; font-weight: 600; }
.ocard__btns { width: 31%; flex: none; display: flex; gap: 8px; }
.ocard__btns .btn { flex: 1; min-height: 40px; }
.ocard__book { padding-top: 16px; }
.ocard__booktop { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; margin-bottom: 14px; border-bottom: 1px solid var(--n-300); }
.ocard__booktop b { font-size: 14px; font-weight: 600; color: var(--n-800); }
.sidetoggle { display: flex; gap: 2px; background: var(--n-200); border-radius: 999px; padding: 4px; }
.sidetoggle button { padding: 4px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--n-600); }
.sidetoggle button.is-yes { background: var(--n-0); color: var(--ok-700); box-shadow: 0 1px 2px rgba(0,0,0,.07); }
.sidetoggle button.is-no { background: var(--n-0); color: var(--no-700); box-shadow: 0 1px 2px rgba(0,0,0,.07); }

/* ---------- order book ----------------------------------------------------- */
.book__head { display: flex; font-size: 11px; font-weight: 500; color: var(--n-500); padding-left: 52px; margin-bottom: 6px; }
.book__head div { flex: 1; }
.book__side { display: flex; align-items: stretch; }
.book__tag { width: 40px; flex: none; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.book__tag--ask { background: var(--no-200); color: var(--no-700); border-radius: 8px 8px 0 0; }
.book__tag--bid { background: var(--ok-150); color: var(--ok-700); border-radius: 0 0 8px 8px; }
.book__rows { margin-left: 12px; flex: 1; min-width: 0; }
.book__row { position: relative; display: flex; align-items: center; gap: 12px; min-height: 34px; font-size: 13px; font-variant-numeric: tabular-nums; }
.book__cell { flex: 1; position: relative; z-index: 1; padding-left: 8px; color: var(--n-600); }
.book__cell--price { font-weight: 600; }
.book__cell--ask { color: var(--no-700); }
.book__cell--bid { color: var(--ok-700); }
.book__bar { position: absolute; inset: 2px auto 2px 0; border-radius: 4px; z-index: 0; }
.book__bar--ask { background: var(--no-200); }
.book__bar--bid { background: var(--ok-200); }
.book__spread { display: flex; align-items: center; justify-content: space-between; margin: 8px 0 8px 52px; padding: 6px 10px; border-radius: 8px; background: var(--n-150); font-size: 11px; font-weight: 600; color: var(--n-500); font-variant-numeric: tabular-nums; }

/* ---------- trade panel ---------------------------------------------------- */
.trade { padding: 18px; position: sticky; top: 92px; }
.trade__head { display: flex; align-items: center; gap: 13px; margin-bottom: 16px; }
.trade__head h3 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -.01em; color: var(--n-800); }
.trade__head small { display: block; margin-top: 2px; font-size: 13px; font-weight: 600; }
.trade__modes { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.segment { display: flex; background: var(--n-200); border-radius: 999px; padding: 4px; }
.segment button { padding: 7px 18px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--n-600); }
.segment button.is-active { background: var(--n-0); color: var(--n-800); font-weight: 700; box-shadow: 0 1px 2px rgba(0,0,0,.07); }
.ordertype { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--n-600); }
.sides { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-bottom: 18px; }
.side { border-radius: var(--radius); padding: 12px; text-align: center; border: 1.5px solid transparent; background: var(--n-150); transition: all .15s; }
.side b { display: block; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
.side span { font-size: 12px; font-weight: 600; color: var(--n-500); font-variant-numeric: tabular-nums; }
.side--yes.is-active { background: var(--ok-150); border-color: var(--ok-500); }
.side--yes.is-active b { color: var(--ok-700); }
.side--no.is-active { background: var(--no-150); border-color: var(--no-500); }
.side--no.is-active b { color: var(--no-700); }
.field { margin-bottom: 14px; }
.field__label { display: flex; align-items: center; justify-content: space-between; margin-bottom: 7px; font-size: 12px; font-weight: 600; color: var(--n-500); }
.field__label b { color: var(--n-700); font-weight: 600; font-variant-numeric: tabular-nums; }
.input { display: flex; align-items: center; gap: 8px; border: 1px solid var(--n-250); background: var(--n-0); border-radius: var(--radius); padding: 12px 14px; }
.input span { font-size: 20px; font-weight: 600; color: var(--n-400); }
.input b { flex: 1; font-size: 22px; font-weight: 700; color: var(--n-800); font-variant-numeric: tabular-nums; }
.input em { font-style: normal; font-size: 12px; font-weight: 600; color: var(--n-500); }
.stepper { display: flex; gap: 6px; }
.stepper button { border: 1px solid var(--n-250); border-radius: 8px; padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--n-600); background: var(--n-0); }
.stepper button:hover { border-color: var(--n-300); color: var(--n-800); }
.quickamts { display: flex; gap: 6px; margin-bottom: 16px; }
.quickamts button { flex: 1; border-radius: 8px; background: var(--n-150); padding: 7px 0; font-size: 12px; font-weight: 600; color: var(--n-600); }
.quickamts button:hover { background: var(--n-200); color: var(--n-800); }
.summary { border-top: 1px solid var(--n-200); padding-top: 13px; margin-bottom: 15px; display: flex; flex-direction: column; gap: 9px; }
.summary__row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--n-600); }
.summary__row b { font-weight: 700; color: var(--n-800); font-variant-numeric: tabular-nums; }
.summary__row.is-payout b { color: var(--ok-700); font-size: 15px; }
.trade__note { margin: 11px 0 0; text-align: center; font-size: 11px; line-height: 1.5; color: var(--n-500); }
.trade__note a { color: var(--n-700); font-weight: 600; }

/* ---------- rules / activity ---------------------------------------------- */
.acc { padding: 4px 18px; margin-top: 26px; }
.acc__item { border-bottom: 1px solid var(--n-200); }
.acc__item:last-child { border-bottom: 0; }
.acc__q { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 16px 0; font-size: 14px; font-weight: 600; color: var(--n-800); text-align: left; }
.acc__a { padding: 0 0 18px; font-size: 13px; line-height: 1.65; color: var(--n-600); max-width: 72ch; }
.acc__a code { background: var(--n-150); border-radius: 5px; padding: 1px 6px; font-size: 12px; }

.oracle { display: flex; align-items: center; gap: 14px; padding: 16px 18px; margin-top: 18px; border: 1px solid var(--n-200); background: var(--n-0); border-radius: var(--radius-lg); }
.oracle__body { flex: 1; }
.oracle__body b { display: block; font-size: 13px; font-weight: 600; color: var(--n-800); }
.oracle__body span { font-size: 12px; color: var(--n-500); }

.act { margin-top: 26px; padding: 6px 18px 14px; }
.act__row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--n-200); font-size: 13px; }
.act__row:last-child { border-bottom: 0; }
.act__tag { flex: none; border-radius: 999px; padding: 3px 9px; font-size: 10px; font-weight: 700; }
.act__tag--buyyes { background: var(--ok-150); color: var(--ok-700); }
.act__tag--buyno { background: var(--no-150); color: var(--no-700); }
.act__tag--sellyes { background: var(--n-200); color: var(--n-600); }
.act__outcome { flex: 1; min-width: 0; font-weight: 600; color: var(--n-800); }
.act__actor { color: var(--n-500); font-variant-numeric: tabular-nums; width: 96px; flex: none; }
.act__amt { width: 84px; flex: none; text-align: right; font-weight: 700; color: var(--n-800); font-variant-numeric: tabular-nums; }
.act__px { width: 52px; flex: none; text-align: right; color: var(--n-600); font-variant-numeric: tabular-nums; }
.act__time { width: 84px; flex: none; text-align: right; color: var(--n-400); font-variant-numeric: tabular-nums; }

/* ---------- close-ups ------------------------------------------------------ */
.closeups { padding: 34px 0 70px; background: var(--n-200); min-height: 100vh; }
.closeups__grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; }
.shot { display: flex; flex-direction: column; gap: 11px; }
.shot__cap { display: flex; align-items: baseline; gap: 9px; }
.shot__cap b { font-size: 13px; font-weight: 700; color: var(--n-800); }
.shot__cap span { font-size: 12px; color: var(--n-500); }
.shot__frame { background: var(--n-0); border-radius: var(--radius-lg); padding: 18px; box-shadow: var(--shadow-lift); }
.shot__frame--muted { background: var(--n-150); }
.shot__frame .trade { position: static; padding: 0; box-shadow: none; }

/* ---------- portfolio ------------------------------------------------------ */
.pf { padding: 30px 0 128px; }
.pf__top { display: grid; grid-template-columns: 1.35fr 1fr; gap: 20px; margin-bottom: 26px; }
.pf__hero { padding: 24px; display: flex; flex-direction: column; }
.pf__value { font-size: 38px; font-weight: 700; letter-spacing: -.03em; color: var(--n-800); font-variant-numeric: tabular-nums; margin: 6px 0 4px; }
.pf__delta { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pf__split { display: flex; gap: 30px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--n-200); }
.pf__split b { display: block; font-size: 17px; font-weight: 700; color: var(--n-800); font-variant-numeric: tabular-nums; }
.pf__split span { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--n-500); }
.pf__chart { padding: 20px 22px; display: flex; flex-direction: column; }
.tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--n-200); }
.tabs button { padding: 11px 16px; font-size: 14px; font-weight: 600; color: var(--n-500); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.is-active { color: var(--brand-ink); border-bottom-color: var(--brand-ink); }
.tablewrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table th { text-align: left; padding: 0 14px 11px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--n-500); }
.table th.num, .table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.table td { padding: 13px 14px; border-top: 1px solid var(--n-200); color: var(--n-700); }
.table tbody tr:hover { background: var(--n-100); }
.table .pos { display: flex; align-items: center; gap: 11px; }
.table .pos b { display: block; font-size: 13px; font-weight: 600; color: var(--n-800); }
.table .pos span { font-size: 11px; color: var(--n-500); }
.table .strong { font-weight: 700; color: var(--n-800); }

/* ---------- AI assistant dock ---------------------------------------------- */
/* Mirrors the shipped Truman dock: a pill fixed to the bottom centre of every
   app screen, which grows a suggestion row and an answer card above it once a
   preset prompt is chosen. */

.dock {
  position: fixed; left: 50%; bottom: 18px; z-index: 120;
  width: min(420px, calc(100vw - 32px));
  transform: translateX(-50%);
  display: flex; flex-direction: column; gap: 10px;
}
.dock--open { width: min(760px, calc(100vw - 32px)); }

/* With the dock open, the page behind it is pushed back so the answer card
   reads as a layer over the app rather than one more card on it. Sits under
   the dock, and under the nav and the mockup bar so the venue's own brand
   stays crisp in the screenshot. */
.dockscrim {
  position: fixed; inset: 0; z-index: 100;
  background: var(--ai-scrim);
  -webkit-backdrop-filter: blur(3px);
  backdrop-filter: blur(3px);
}
/* Static copy for the close-ups gallery, where it is a specimen not a dock. */
.dock--inline { position: static; transform: none; width: 100%; }

.composer {
  display: flex; align-items: center; gap: 10px;
  height: 68px; padding: 12px;
  border: 1px solid var(--n-300); border-radius: 999px; background: var(--ai-surface);
  box-shadow: var(--ai-lift);
}
.composer__avatar {
  width: 44px; height: 44px; border-radius: 999px; flex: none;
  display: grid; place-items: center; color: #FFFFFF;
  background: linear-gradient(145deg, var(--ai-from), var(--ai-to));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
}
.composer__avatar svg { width: 24px; height: 24px; }
.composer__avatar--sm { width: 36px; height: 36px; }
.composer__avatar--sm svg { width: 20px; height: 20px; }
.composer__input { flex: 1; min-width: 0; font-size: 15px; color: var(--n-400); }
.composer__send {
  width: 44px; height: 44px; border-radius: 999px; flex: none;
  display: grid; place-items: center;
  background: var(--brand); color: var(--brand-on);
}
.composer__send svg { width: 19px; height: 19px; }

.chips { display: flex; gap: 6px; padding: 2px 4px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip-ai {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 12px; white-space: nowrap;
  border: 1px solid var(--n-300); border-radius: 999px; background: var(--ai-surface);
  font-size: 12px; font-weight: 500; color: var(--n-700);
  box-shadow: 0 2px 6px -3px rgba(15,23,42,.24);
}
.chip-ai svg { width: 13px; height: 13px; color: var(--n-400); }
.chip-ai.is-active { border-color: var(--brand-ink); color: var(--brand-ink); background: var(--brand-tint); }
.chip-ai.is-active svg { color: var(--brand-ink); }

.airesp {
  display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--n-300); border-radius: 28px; background: var(--ai-surface);
  box-shadow: var(--ai-lift);
}
.airesp__head { display: flex; align-items: center; gap: 12px; padding: 13px 18px; border-bottom: 1px solid var(--n-200); }
.airesp__who { min-width: 0; flex: 1; }
.airesp__who b { display: block; font-size: 13px; font-weight: 600; color: var(--n-800); }
.airesp__who span { display: block; margin-top: 2px; font-size: 12px; color: var(--n-500); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.airesp__acts { flex: none; display: flex; gap: 2px; }
.airesp__act { width: 32px; height: 32px; border-radius: 999px; display: grid; place-items: center; color: var(--n-500); }
.airesp__act svg { width: 15px; height: 15px; }
.airesp__body {
  display: flex; flex-direction: column; gap: 14px;
  padding: 16px 18px;
  max-height: calc(100vh - 260px); overflow-y: auto;
}
.airesp__intro { margin: 0; font-size: 13px; line-height: 1.6; color: var(--n-700); }
.airesp__foot { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; border-top: 1px solid var(--n-200); font-size: 12px; font-weight: 600; color: var(--n-600); }
.airesp__foot svg { width: 13px; height: 13px; }

.aistats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.aistat { border: 1px solid var(--n-200); background: var(--n-150); border-radius: 12px; padding: 12px; }
.aistat span { font-size: 11px; font-weight: 500; color: var(--n-500); }
.aistat b { display: block; margin-top: 4px; font-size: 15px; font-weight: 600; color: var(--n-800); font-variant-numeric: tabular-nums; }
.aistat small { display: block; margin-top: 3px; font-size: 11px; color: var(--n-500); }

.aibullets { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; }
.aibullets li { position: relative; padding-left: 17px; font-size: 13px; line-height: 1.55; color: var(--n-700); }
.aibullets li::before { content: ''; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 999px; background: var(--brand-ink); }

.aisources { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 13px; border-top: 1px solid var(--n-200); }
.aisource { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; background: var(--n-150); padding: 4px 10px; font-size: 11px; color: var(--n-600); }
.aisource b { font-weight: 700; color: var(--n-700); font-variant-numeric: tabular-nums; }

/* ---------- responsive ----------------------------------------------------- */
/* Four steps: 1080 collapses the two-column screens, 880 folds the nav into a
   drawer behind a hamburger, 720 is the phone layout, and 480 trims the brand
   lockup so the top row still fits on the narrowest common handset. */

@media (max-width: 1080px) {
  .hero, .detail__cols, .pf__top, .closeups__grid { grid-template-columns: 1fr; }
  .grid { grid-template-columns: repeat(2, 1fr); }
  .trade { position: static; }
}

@media (max-width: 880px) {
  /* The links, balance and CTA drop below the bar; the theme toggle and the
     hamburger stay on it. display:contents lifts the children of .nav__right
     into .nav__inner so they can be ordered against .nav__links without
     duplicating any markup into a second drawer element. */
  .nav__inner { flex-wrap: wrap; height: auto; min-height: var(--nav-h); gap: 12px; padding: 10px 0; }
  .nav__right { display: contents; }
  .themetoggle { order: 2; margin-left: auto; }
  .nav__burger { order: 3; display: grid; }

  .nav__links,
  .nav__balance,
  .nav__right > .btn--brand { display: none; flex-basis: 100%; }

  body.nav-open .nav__links {
    display: flex; order: 4; flex-direction: column; gap: 2px;
    padding-top: 10px; border-top: 1px solid var(--n-200);
  }
  body.nav-open .nav__link { padding: 12px 14px; border-radius: 10px; font-size: 15px; }
  body.nav-open .nav__balance {
    display: flex; order: 5; flex-direction: row; align-items: center;
    justify-content: space-between; padding: 0 4px 2px; border-right: 0;
  }
  body.nav-open .nav__right > .btn--brand {
    display: inline-flex; order: 6; min-height: 46px; margin-bottom: 6px;
  }
}

@media (max-width: 720px) {
  .wrap { padding: 0 14px; }
  .mockbar { gap: 10px; padding: 0 12px; }
  .mockbar__label, .mockbar__hint { display: none; }
  .grid { grid-template-columns: 1fr; }

  /* discovery */
  .disco { padding: 22px 0 44px; }
  .hero { padding: 18px; gap: 22px; margin-bottom: 24px; }
  .hero__title { font-size: 23px; }
  .hero__sub { font-size: 14px; margin-bottom: 16px; }
  .hero__stats { flex-wrap: wrap; gap: 16px 26px; }
  .hero__cta { flex-wrap: wrap; }
  .hero__cta .btn { flex: 1 1 auto; }
  .controls { gap: 10px; }
  .search { margin-left: 0; width: 100%; min-width: 0; }
  .mcard { padding: 16px; }

  /* market detail */
  .detail { padding: 20px 0 44px; }
  .mhead { gap: 12px; margin-bottom: 18px; }
  .mhead__title { font-size: 20px; }
  .mhead__q { font-size: 14px; }
  .chartcard { padding: 16px; }
  .chartcard__top { flex-wrap: wrap; gap: 12px; }
  .metrics { flex-wrap: wrap; gap: 12px 22px; }
  .metric b { font-size: 16px; }
  .ranges { margin-left: auto; }

  /* label and odds share a line, the Yes/No pair gets its own */
  .ocard { padding: 12px 13px; }
  .ocard__main { flex-wrap: wrap; gap: 10px 12px; }
  .ocard__label { width: auto; flex: 1 1 auto; min-width: 0; font-size: 15px; }
  .ocard__chance { flex: 0 0 auto; justify-content: flex-end; }
  .ocard__btns { width: 100%; }

  .book__head { padding-left: 46px; }
  .book__row { gap: 6px; font-size: 12px; }
  .book__tag { width: 34px; }
  .book__spread { margin-left: 46px; }

  .oracle { flex-wrap: wrap; }
  .oracle .btn { width: 100%; }

  /* the activity row splits in two: what traded on the first line, the numbers
     on the second. .act__outcome grows and the actor claims a wide basis, so
     the break lands in the same place whatever the outcome label is. */
  .act__row { flex-wrap: wrap; gap: 4px 10px; padding: 10px 0; }
  .act__outcome { flex: 1 1 auto; }
  .act__actor { width: auto; flex: 1 1 46%; text-align: left; font-size: 12px; }
  .act__amt, .act__px { width: auto; }
  .act__time { width: auto; margin-left: auto; }

  /* portfolio */
  .pf { padding: 22px 0 44px; }
  .pf__value { font-size: 30px; }
  .pf__hero, .pf__chart { padding: 18px; }
  .pf__split { flex-wrap: wrap; gap: 14px 26px; margin-top: 18px; }
  .tabs { overflow-x: auto; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button { flex: none; padding: 11px 12px; font-size: 13px; }

  /* Seven columns will not compress into a phone. Scrolling them sideways
     screenshots as a clipped table, so the secondary ones drop instead and
     what a holder actually reads stays: what it is and what it is worth. The
     Yes/No side is carried by the outcome label on every other screen.
     .tablewrap still catches anything that overruns. */
  .table th, .table td { padding: 12px 7px; }
  .table td.num, .table th.num { font-size: 12px; }
  .table--positions th:first-child, .table--positions td:first-child,
  .table--orders th:first-child, .table--orders td:first-child { width: 50%; }
  .table--positions th:nth-child(2), .table--positions td:nth-child(2),
  .table--positions th:nth-child(3), .table--positions td:nth-child(3),
  .table--positions th:nth-child(4), .table--positions td:nth-child(4),
  .table--positions th:nth-child(5), .table--positions td:nth-child(5),
  .table--orders th:nth-child(2), .table--orders td:nth-child(2),
  .table--orders th:nth-child(3), .table--orders td:nth-child(3),
  .table--orders th:nth-child(5), .table--orders td:nth-child(5),
  .table--orders th:nth-child(7), .table--orders td:nth-child(7) { display: none; }

  /* assistant dock */
  .disco, .detail, .pf { padding-bottom: 112px; }
  .dock { bottom: 12px; }
  .composer { height: 56px; padding: 8px; gap: 8px; }
  .composer__avatar, .composer__send { width: 40px; height: 40px; }
  .composer__input { font-size: 14px; }
  .airesp__head { padding: 12px 14px; }
  .airesp__body { padding: 14px; max-height: calc(100vh - 220px); }
  .aistats { grid-template-columns: 1fr; }

  /* close-ups */
  .closeups { padding: 24px 0 48px; }
  .closeups__grid { gap: 20px; }
  .shot__frame { padding: 14px; }
  .trade { padding: 16px; }
}

@media (max-width: 480px) {
  .brandmark { gap: 7px; min-width: 0; }
  .brandmark__lockup, .brandmark__lockup svg { height: 24px; }
  .brandmark__glyph { width: 27px; height: 27px; }
  .brandmark__product { font-size: 10px; padding: 3px 6px; }
  .brandmark__text { font-size: 15px; }
  .nav__inner { gap: 10px; }
}
</style>
</head>
<body>

<div class="mockbar">
  <span class="mockbar__label">Mockup</span>
  <div class="mockbar__tabs" id="mockTabs"></div>
  <span class="mockbar__hint">Add <code>?clean=1</code> to hide this bar before screenshotting · <code>?screen=detail</code> to deep-link</span>
</div>

<div id="app"></div>

<script>
/* ==========================================================================
 * ██  EDIT HERE  ██  Everything that changes per Sovereign Venue lives in
 * this one CONFIG block: the identity (name, logo, colors, font) AND the
 * content (market questions, units, numbers). Nothing below this block needs
 * touching to produce a new branded set of screenshots.
 * ========================================================================== */

var CONFIG = {

  /* ---------------------------------------------------------------- brand */
  brand: {
    name: 'ZEE5',
    product: 'Predict',

    markText: 'Z5',
    lockupSvg: null,

    // Noto Sans is ZEE5's actual web face (their bundle ships notasansRegular
    // and notasansBold), and it is on Google Fonts — so this is an exact match
    // rather than a substitute.
    fontFamily: "'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
    fontUrl: 'https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap',

    colors: {
      // NOTE: #1D001E (dark page below) is ZEE5's published theme-color. The
      // violet is DERIVED from that hue (298°) — their accent token sits
      // behind an Akamai block. Swap in the official hex when available.
      brand:      '#B336E2',
      brandDark:  '#9526C4',
      brandLight: '#D07BF0',
      yes:        '#10B981',
      no:         '#EF4444'
    },

    defaultTheme: 'light',

    themes: {
      light: {
        brandInk:  '#7B1FA2',   // the violet, darkened enough to read on white
        brandTint: '#F5E6FC',
        brandOn:   '#FFFFFF',
        vars: {}
      },
      dark: {
        brandInk:  '#D07BF0',
        brandTint: '#3D1450',
        brandOn:   '#FFFFFF',
        vars: {
          '--n-0':   '#2A0A2C',
          '--n-100': '#331135',
          '--n-150': '#1D001E',    // ZEE5's theme-color, exact

    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function q(name) {
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search);
  return m ? decodeURIComponent(m[1]) : null;
}

/* A categorical market ("who wins?") has no unit. Everything unit-aware falls
 * back to this so one code path serves both market shapes. */
var UNITLESS = { symbol: '', position: 'suffix', decimals: 0 };

function unitOf(market) {
  return market.unit || UNITLESS;
}

/* True when a market's outcomes are named entrants rather than numeric bands. */
function isCategorical(market) {
  return Boolean(market.outcomes.length && market.outcomes[0].kind === 'named');
}

/* Formats a raw number in a market's declared unit. This is the single place
 * price-vs-percentage is decided — every strike, axis tick and headline value
 * on every screen goes through it. */
function fmtValue(value, unit) {
  var decimals = unit.decimals == null ? 2 : unit.decimals;
  var body = unit.thousands
    ? Number(value).toLocaleString('en-US', {
        minimumFractionDigits: decimals,
        maximumFractionDigits: decimals

  return unit.position === 'prefix' ? unit.symbol + body : body + unit.symbol;
}

/* Outcome -> human label. A named outcome carries its own text (a contestant,
 * a team); a band is rendered in the market's unit. */
function outcomeLabel(outcome, unit) {
  if (outcome.kind === 'named') return outcome.label;
  if (outcome.kind === 'below') return 'Below ' + fmtValue(outcome.a, unit);
  if (outcome.kind === 'above') return fmtValue(outcome.a, unit) + ' or higher';
  return fmtValue(outcome.a, unit) + ' – ' + fmtValue(outcome.b, unit);
}

/* Short label for tight spots (chart legend, distribution axis, tables). */
function outcomeShort(outcome, unit) {
  if (outcome.kind === 'named') return outcome.short || outcome.label;
  if (outcome.kind === 'below') return '<' + fmtValue(outcome.a, unit);
  if (outcome.kind === 'above') return '≥' + fmtValue(outcome.a, unit);
  return fmtValue(outcome.a, unit);
}

function money(value, decimals) {
  return (
    '$' +

function leadIndex(market) {
  if (!market.outcomes.length) return -1;
  var best = 0;
  market.outcomes.forEach(function (o, i) {
    if (o.chance > market.outcomes[best].chance) best = i;

/* Probability-weighted midpoint of the bands — the "market forecast" number
 * the discovery card leads with. Open-ended bands are anchored one step out
 * so they still contribute a sane value. */
function marketForecast(market) {
  var total = 0;
  var acc = 0;
  var span = 0;
  market.outcomes.forEach(function (o) {

  market.outcomes.forEach(function (o) {

      '" font-size="10" font-weight="500" fill="var(--n-400)">' + esc(label) + '</text>';
  });

  series.forEach(function (path, index) {
    var d = path
      .map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); })
      .join(' ');
    var emphasis = index === opt.emphasize;
    out +=
      '<path d="' + d + '" fill="none" stroke="' + colors[index] +
      '" stroke-width="' + (emphasis ? 2.75 : 1.75) +
      '" stroke-linejoin="round" stroke-linecap="round" opacity="' + (emphasis ? 1 : 0.62) + '" />';
    out +=
      '<circle cx="' + x(points - 1).toFixed(1) + '" cy="' + y(path[points - 1]).toFixed(1) +
      '" r="' + (emphasis ? 4.5 : 3) + '" fill="' + colors[index] + '" stroke="var(--n-0)" stroke-width="2" />';
  });

  return out + '</svg>';
}

function areaChart(path, color, options) {
  var opt = options || {};
  var w = opt.width || 480;
  var h = opt.height || 150;
  var points = path.length;
  var min = Math.min.apply(null, path);
  var max = Math.max.apply(null, path);
  var range = max - min || 1;
  var x = function (i) { return (w * i) / (points - 1); };
  var y = function (v) { return h - 12 - ((h - 24) * (v - min)) / range; };

  var line = path
    .map(function (v, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(v).toFixed(1); })
    .join(' ');
  var fill = line + ' L ' + w + ' ' + h + ' L 0 ' + h + ' Z';
  var id = 'g' + Math.abs(seedOf(color + points));

  return (
    '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
    '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.20" />' +
    '<stop offset="100%" stop-color="' + color + '" stop-opacity="0" />' +
    '</linearGradient></defs>' +
    '<path d="' + fill + '" fill="url(#' + id + ')" />' +
    '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linejoin="round" />' +
    '</svg>'
  );
}

/* -------------------------------------------------------------- fragments - */

function markChip(market, size) {
  var cls = 'logo-chip' + (size ? ' logo-chip--' + size : '');
  var bg = market.markColor
    ? ' style="background:' + market.markColor + '1F;color:' + market.markColor + '"'
    : '';
  return '<div class="' + cls + '"' + bg + '>' + esc(market.mark) + '</div>';
}

function brandmark() {
  var b = CONFIG.brand;

  // A full lockup replaces the glyph+text pair entirely, for brands whose
  // wordmark is the logo rather than a mark sitting beside type.
  if (b.lockupSvg) {
    return (
      '<div class="brandmark">' +
      '<div class="brandmark__lockup">' + b.lockupSvg + '</div>' +
      (b.product ? '<span class="brandmark__product">' + esc(b.product) + '</span>' : '') +
      '</div>'
    );
  }

  var glyph = b.markSvg ? b.markSvg : esc(b.markText);
  return (
    '<div class="brandmark">' +
    '<div class="brandmark__glyph">' + glyph + '</div>' +
    '<div class="brandmark__text">' + esc(b.name) + ' <em>' + esc(b.product) + '</em></div>' +

}

function navbar(active) {

/* Light/dark switch, top right of the nav on every screen. */
function themeToggle() {
  return (
    '<div class="themetoggle" role="group" aria-label="Color theme">' +
    '<button data-theme-set="light" title="Light" aria-label="Light theme"' +
    (THEME === 'light' ? ' class="is-active"' : '') + '>' + iconSun() + '</button>' +
    '<button data-theme-set="dark" title="Dark" aria-label="Dark theme"' +
    (THEME === 'dark' ? ' class="is-active"' : '') + '>' + iconMoon() + '</button>' +
    '</div>'
  );
}

function distribution(market, large) {
  var lead = leadIndex(market);
  var max = Math.max.apply(null, market.outcomes.map(function (o) { return o.chance; }));
  var bars = market.outcomes
    .map(function (o, i) {
      return (
        '<div class="dist__bar' + (i === lead ? ' is-lead' : '') +
        '" style="height:' + Math.max(6, (o.chance / max) * 100) + '%"></div>'
      );
    })
    .join('');
  var html = '<div class="dist' + (large ? ' dist--lg' : '') + '">' + bars + '</div>';
  if (large) {
    html +=
      '<div class="distlabels">' +
      market.outcomes
        .map(function (o, i) {
          return '<span class="' + (i === lead ? 'is-lead' : '') + '">' + esc(outcomeShort(o, unitOf(market))) + '</span>';
        })
        .join('') +
      '</div>';
  }
  return html;
}

function statusBadge(market) {
  if (market.status === 'soon') return '<span class="badge badge--soon">Coming soon</span>';
  if (market.status === 'new') return '<span class="badge badge--new">New</span>';
  if (market.status === 'resolved') return '<span class="badge badge--resolved">Market resolved</span>';
  return '';
}

/* ------------------------------------------------------ screen: discovery - */

function marketCard(market) {
  var isSoon = market.status === 'soon' || !market.outcomes.length;
  var settled = resolvedOutcome(market);
  var lead = leadIndex(market);
  var body;

  if (isSoon) {
    body =
      '<p style="margin:0;font-size:13px;line-height:1.6;color:var(--n-600)">Trade ' +
      esc(market.title.toLowerCase()) + ' when this market opens.</p>' +
      '<div class="mcard__foot"><span></span><span class="tnum">Settles ' + esc(market.settles) + '</span></div>';
  } else if (settled) {
    // A finished market leads with the result, not with odds nobody can act on.
    body =
      '<div class="mcard__stat"><p class="eyebrow">Result</p>' +
      '<span class="pill pill--neutral">' + esc(outcomeLabel(settled, unitOf(market))) + '</span></div>' +
      distribution(market) +
      '<div class="mcard__foot">' +
      '<span class="tnum">' + esc(market.openInterest) + ' Open Interest</span>' +
      '<span class="tnum">Settled ' + esc(market.settles) + '</span>' +
      '</div>' +
      '<span class="btn btn--ghost" style="width:100%;min-height:38px">View Market</span>';
  } else {
    // Categorical markets have no meaningful weighted midpoint, so they lead
    // with the front-runner and their odds instead of a forecast value.
    var headline = isCategorical(market)
      ? '<div class="mcard__row">' +
        '<div class="mcard__stat"><p class="eyebrow">Front-runner</p>' +
        '<span class="pill pill--brand">' + esc(outcomeLabel(market.outcomes[lead], unitOf(market))) + '</span></div>' +
        '<div class="mcard__stat"><p class="eyebrow">Odds</p>' +
        '<span class="pill pill--neutral tnum">' + market.outcomes[lead].chance + '%</span></div>' +
        '</div>'
      : '<div class="mcard__row">' +
        '<div class="mcard__stat"><p class="eyebrow">Market forecast</p>' +
        '<span class="pill pill--brand tnum">' + esc(fmtValue(marketForecast(market), unitOf(market))) + '</span></div>' +
        '<div class="mcard__stat"><p class="eyebrow">Leading range</p>' +
        '<span class="pill pill--neutral tnum">' + esc(leadingRange(market)) + '</span></div>' +
        '</div>';

    body =
      headline +
      distribution(market) +
      '<div class="mcard__foot">' +
      '<span class="tnum">' + esc(market.openInterest) + ' Open Interest</span>' +
      '<span class="tnum">' + esc(market.countdown) + '</span>' +
      '</div>' +
      '<span class="btn btn--brand" style="width:100%;min-height:38px">Predict</span>';
  }

  return (
    '<article class="mcard">' +
    '<div class="mcard__head">' + markChip(market) +
    '<p class="mcard__q">' + esc(market.question) + '</p>' + statusBadge(market) +
    '</div>' + body + '</article>'
  );
}

/* ------------------------------------------------------- assistant: Truman - */
/* The shipped dock resolves its suggested prompts from the page it is on, so
 * the mockup does the same: prompts and their canned answers hang off the
 * market, not off the brand. A market without them still shows the pill. */

function assistantConfig() {
  return CONFIG.brand.assistant || {};
}

function assistantPrompts(market) {
  return (market && market.assistantPrompts) || [];
}

/* The pill. Suggestions appear above it, the way the real composer reveals
 * them once it has focus. */
function aiComposer(market, showChips, activeIndex) {
  var a = assistantConfig();
  var prompts = assistantPrompts(market);
  var chips =
    showChips && prompts.length
      ? '<div class="chips">' +
        prompts
          .map(function (p, i) {
            return (
              '<button class="chip-ai' + (i === activeIndex ? ' is-active' : '') + '">' +
              esc(p.chip) + iconCornerUp() + '</button>'
            );
          })
          .join('') +
        '</div>'
      : '';

  return (
    chips +
    '<div class="composer">' +
    '<span class="composer__avatar">' + iconOwl() + '</span>' +
    '<span class="composer__input">' + esc(a.placeholder || 'Ask anything...') + '</span>' +
    '<button class="composer__send" aria-label="Send">' + iconArrowUp() + '</button>' +
    '</div>'
  );
}

/* One canned answer. `stats`, `bullets` and `sources` are each optional, which
 * is what lets a numbers answer and a headlines answer share one shape. */
function aiResponse(market, index) {
  var a = assistantConfig();
  var p = assistantPrompts(market)[index];

  var stats = !p.stats ? '' :
    '<div class="aistats">' +
    p.stats
      .map(function (st) {
        return (
          '<div class="aistat"><span>' + esc(st.label) + '</span>' +
          '<b class="tnum">' + esc(st.value) + '</b>' +
          (st.note ? '<small>' + esc(st.note) + '</small>' : '') + '</div>'
        );
      })
      .join('') +
    '</div>';

  var bullets = !p.bullets ? '' :
    '<ul class="aibullets">' +
    p.bullets.map(function (b) { return '<li>' + esc(b) + '</li>'; }).join('') +
    '</ul>';

  var sources = !p.sources ? '' :
    '<div class="aisources">' +
    p.sources
      .map(function (src, i) {
        return '<span class="aisource"><b>' + (i + 1) + '</b>' + esc(src) + '</span>';
      })
      .join('') +
    '</div>';

  return (
    '<article class="airesp">' +
    '<header class="airesp__head">' +
    '<span class="composer__avatar composer__avatar--sm">' + iconOwl() + '</span>' +
    '<div class="airesp__who"><b>' + esc(a.name || 'Assistant') + '</b>' +
    '<span>' + esc(p.question) + '</span></div>' +
    '<div class="airesp__acts">' +
    '<span class="airesp__act">' + iconPlus() + '</span>' +
    '<span class="airesp__act">' + iconExternal() + '</span>' +
    '<span class="airesp__act">' + iconClose() + '</span>' +
    '</div></header>' +
    '<div class="airesp__body">' +
    '<p class="airesp__intro">' + esc(p.intro) + '</p>' +
    stats + bullets + sources +
    '</div>' +
    '<div class="airesp__foot">' + iconChevronUp() + 'Expand answer</div>' +
    '</article>'
  );
}

/* openIndex null renders the collapsed pill that sits on every app screen.
 * A number renders it mid-conversation, which is the AI Assistant screen. */
function aiDock(market, openIndex, inline) {
  var open = openIndex != null && assistantPrompts(market)[openIndex];
  return (
    // The gallery specimen is a static copy, so it never dims the page.
    (open && !inline ? '<div class="dockscrim" aria-hidden="true"></div>' : '') +
    '<div class="dock' + (open ? ' dock--open' : '') + (inline ? ' dock--inline' : '') + '">' +
    (open ? aiResponse(market, openIndex) : '') +
    aiComposer(market, Boolean(open), openIndex) +
    '</div>'
  );
}

/* --------------------------------------------------------- screen: detail - */

function orderBook(market, outcomeIndex) {
  var o = market.outcomes[outcomeIndex];
  var rand = seeded(seedOf(market.slug + outcomeIndex));
  var asks = [];
  var bids = [];

  for (var i = 3; i >= 1; i--) {
    asks.push({ price: o.yes + i, contracts: Math.round(400 + rand() * 5200) });
  }
  asks.push({ price: o.yes, contracts: Math.round(900 + rand() * 4200) });
  for (var j = 0; j < 4; j++) {
    bids.push({ price: o.yes - 1 - j, contracts: Math.round(700 + rand() * 5600) });
  }

  var max = Math.max.apply(null, asks.concat(bids).map(function (r) { return r.contracts; }));
  var running = 0;

  var askRows = asks
    .map(function (r) {
      running += r.contracts;
      return row(r, running, 'ask', max);
    })
    .join('');

  running = 0;
  var bidRows = bids
    .map(function (r) {
      running += r.contracts;
      return row(r, running, 'bid', max);
    })
    .join('');

  function row(r, total, kind, peak) {
    return (
      '<div class="book__row">' +
      '<div class="book__cell book__cell--price book__cell--' + kind + '">' +
      '<span class="book__bar book__bar--' + kind + '" style="width:' +
      Math.round((r.contracts / peak) * 100) + '%"></span>' +
      '<span style="position:relative">' + r.price + '¢</span></div>' +
      '<div class="book__cell">' + r.contracts.toLocaleString('en-US') + '</div>' +
      '<div class="book__cell">' + money((total * r.price) / 100, 0) + '</div>' +
      '</div>'
    );
  }

  return (
    '<div class="book">' +
    '<div class="book__head"><div>Price</div><div>Contracts</div><div>Total</div></div>' +
    '<div class="book__side"><div class="book__tag book__tag--ask">Asks</div>' +
    '<div class="book__rows">' + askRows + '</div></div>' +
    '<div class="book__spread"><span>Spread ' + (asks[asks.length - 1].price - bids[0].price) + '¢</span>' +
    '<span>Last ' + o.yes + '¢</span></div>' +
    '<div class="book__side"><div class="book__tag book__tag--bid">Bids</div>' +
    '<div class="book__rows">' + bidRows + '</div></div>' +
    '</div>'
  );
}

function outcomeRow(market, index, expandedIndex) {
  var o = market.outcomes[index];
  var open = index === expandedIndex;
  var delta =
    o.change === 0
      ? ''
      : '<small class="' + (o.change > 0 ? 'delta--up' : 'delta--down') + '">' +
        (o.change > 0 ? '▲' : '▼') + ' ' + Math.abs(o.change) + '%</small>';

  var expansion = open
    ? '<div class="ocard__book">' +
      '<div class="ocard__booktop"><b>Order Book</b>' +
      '<div class="sidetoggle"><button class="is-yes">Yes</button><button>No</button></div></div>' +
      orderBook(market, index) + '</div>'
    : '';

  return (
    '<div class="ocard' + (open ? ' is-open' : '') + '">' +
    '<div class="ocard__main">' +
    '<div class="ocard__label">' + esc(outcomeLabel(o, unitOf(market))) + '</div>' +
    '<div class="ocard__chance"><b>' + o.chance + '%</b>' + delta + '</div>' +
    '<div class="ocard__btns">' +
    '<button class="btn btn--yes">Yes ' + o.yes + '¢</button>' +
    '<button class="btn btn--no">No ' + o.no + '¢</button>' +
    '</div></div>' + expansion + '</div>'
  );
}

function tradePanel(market, outcomeIndex, mode) {
  var b = CONFIG.brand;
  var o = market.outcomes[outcomeIndex];
  var isLimit = mode === 'limit';
  var amount = 250;
  var price = isLimit ? o.yes - 2 : o.yes;

    ? '<div class="field">' +

      '<div class="stepper"><button>−</button><button>+</button></div></div>' +
      '</div>'
    : '<div class="field">' +
      '<div class="field__label"><span>Amount</span><b>' + money(CONFIG.portfolio.cash) + ' available</b></div>' +

    ? '<div class="summary">' +
      '<div class="summary__row"><span>Order value</span><b>' + money((shares * price) / 100) + '</b></div>' +
      '<div class="summary__row"><span>Rests at</span><b>' + price + '¢</b></div>' +

    '<div class="ordertype"><span>' + (isLimit ? 'Limit' : 'Market') + '</span>' + iconChevron() + '</div>' +
    '</div>' +

    '<div class="sides">' +
    '<div class="side side--yes is-active"><b>Yes</b><span>' + o.yes + '¢</span></div>' +
    '<div class="side side--no"><b>No</b><span>' + o.no + '¢</span></div>' +
    '</div>' +

    body + summary +
    '<button class="btn btn--brand btn--block">' +
    (isLimit ? 'Place limit order' : 'Buy ' + shares.toLocaleString('en-US') + ' contracts') +
    '</button>' +
    '<p class="trade__note">By trading, you agree to the <a>Terms of Use</a>.<br />' +
    'Settled in ' + esc(b.collateralLabel) + '.</p>' +
    '</div>'

}

function activityList(market) {
  if (!market.activity.length) {
    return '<p style="padding:22px 0;text-align:center;font-size:13px;color:var(--n-500)">No trades yet.</p>';
  }
  return market.activity
    .map(function (a) {
      var key = a.side.replace('-', '');
      var label = a.side === 'buy-yes' ? 'Buy Yes' : a.side === 'buy-no' ? 'Buy No' : 'Sell Yes';
      return (
        '<div class="act__row">' +
        '<span class="act__tag act__tag--' + key + '">' + label + '</span>' +
        '<span class="act__outcome">' + esc(outcomeLabel(market.outcomes[a.outcome], unitOf(market))) + '</span>' +
        '<span class="act__actor">' + esc(a.actor) + '</span>' +
        '<span class="act__amt">' + esc(a.amount) + '</span>' +
        '<span class="act__px">' + esc(a.price) + '</span>' +
        '<span class="act__time">' + esc(a.time) + '</span>' +
        '</div>'
      );
    })
    .join('');
}

/* `assistantOpen` is the index of the preset prompt to show answered. Left
 * out, the dock renders as the collapsed pill it is on a normal visit. */
function screenDetail(assistantOpen) {
  var b = CONFIG.brand;
  var market = flagshipMarket();
  var lead = leadIndex(market);
  var points = 30;
  var series = buildSeries(market, points);
  var colors = market.outcomes.map(function (o, i) { return seriesColor(i, market.outcomes.length); });

    .map(function (o, i) {

        '<div class="legend__item"><span class="legend__dot" style="background:' + colors[i] + '"></span>' +
        esc(outcomeLabel(o, unitOf(market))) + ' <span class="legend__val">' + o.chance + '%</span></div>'

  return (

    '<div class="mhead">' + markChip(market, 'lg') +

    '<p class="mhead__q">' + esc(market.question) + '</p>' +
    '<div class="mhead__meta">' +
    '<span class="chip is-active">' + esc(market.settles) + '</span>' +
    '<span class="chip">Past rounds ' + iconChevron() + '</span>' +
    '<span class="chip">' + esc(market.category) + '</span>' +
    (market.currentValue == null
      ? '<span class="chip">' + esc(market.currentLabel) + '</span>'
      : '<span class="chip">' + esc(market.currentLabel) + ' <b class="tnum">' +
        esc(fmtValue(market.currentValue, unitOf(market))) + '</b></span>') +
    '</div></div></div>' +

    '<div class="card chartcard">' +
    '<div class="chartcard__top">' +
    '<div class="metrics">' +
    '<div class="metric"><b class="tnum">' + esc(market.openInterest) + '</b><span>Open interest</span></div>' +
    '<div class="metric"><b class="tnum">' + esc(market.volume24h) + '</b><span>24h volume</span></div>' +
    '<div class="metric"><b class="tnum">' + market.traders.toLocaleString('en-US') + '</b><span>Traders</span></div>' +
    '<div class="metric"><b class="tnum">' + esc(market.creationCost) + ' ' + esc(b.feeToken) + '</b><span>Creation cost</span></div>' +
    '</div>' +

    ['1D', '1W', '1M', '1Y', 'MAX'].map(function (r) {

    }).join('') +

function screenPortfolio() {
  var b = CONFIG.brand;
  var p = CONFIG.portfolio;
  var rand = seeded(seedOf('portfolio'));
  var path = [];
  var v = p.totalValue - p.change24h * 9;
  for (var i = 0; i < 40; i++) {
    v += (rand() - 0.42) * 380;
    path.push(v);
  }
  path.push(p.totalValue);

  var positionRows = p.positions
    .map(function (pos) {
      var market = CONFIG.markets[pos.market];
      var o = market.outcomes[pos.outcome];
      var up = pos.pnl >= 0;
      return (
        '<tr>' +
        '<td><div class="pos">' + markChip(market, 'sm') +
        '<div><b>' + esc(outcomeLabel(o, unitOf(market))) + '</b>' +
        '<span>' + esc(market.title) + ' · settles ' + esc(market.settles) + '</span></div></div></td>' +
        '<td><span class="badge ' + (pos.side === 'Yes' ? 'badge--new' : 'badge--resolved') + '">' + pos.side + '</span></td>' +

        '<td class="num">' + pos.avg + '¢</td>' +
        '<td class="num strong">' + pos.now + '¢</td>' +
        '<td class="num strong">' + money(pos.value) + '</td>' +

  var orderRows = p.openOrders
    .map(function (order) {
      var market = CONFIG.markets[order.market];

      var pct = Math.round((order.filled / order.shares) * 100);
      return (
        '<tr>' +
        '<td><div class="pos">' + markChip(market, 'sm') +
        '<div><b>' + esc(outcomeLabel(o, unitOf(market))) + '</b>' +

        '<td>' + order.type + '</td>' +
        '<td class="num">' + order.price + '¢</td>' +
        '<td class="num">' + order.shares.toLocaleString('en-US') + '</td>' +
        '<td class="num">' + pct + '% filled</td>' +
        '<td class="num"><button class="btn btn--outline" style="padding:5px 14px;font-size:12px">Cancel</button></td>' +
        '</tr>'
      );
    })
    .join('');

  var up = p.change24h >= 0;

  return (
    navbar('Portfolio') +
    '<div class="pf"><div class="wrap">' +
    '<h1 style="margin:0 0 22px;font-size:24px;font-weight:700;letter-spacing:-.02em">Portfolio</h1>' +

    '<div class="pf__top">' +
    '<div class="card pf__hero">' +
    '<span class="eyebrow">Total value</span>' +
    '<div class="pf__value">' + money(p.totalValue) + '</div>' +
    '<div class="pf__delta ' + (up ? 'delta--up' : 'delta--down') + '">' +
    signed(p.change24h) + ' (' + (up ? '+' : '−') + Math.abs(p.changePct).toFixed(2) + '%) today</div>' +
    '<div class="pf__split">' +
    '<div><b>' + money(p.positionsValue) + '</b><span>In positions</span></div>' +
    '<div><b>' + money(p.cash) + '</b><span>Available ' + esc(b.collateralLabel) + '</span></div>' +
    '<div><b class="delta--up">' + signed(p.realized) + '</b><span>Realized P&amp;L</span></div>' +
    '</div>' +
    '<div style="display:flex;gap:9px;margin-top:auto;padding-top:20px">' +
    '<button class="btn btn--brand">Deposit</button>' +
    '<button class="btn btn--outline">Withdraw</button>' +
    '</div></div>' +

    '<div class="card pf__chart">' +
    '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">' +
    '<span class="eyebrow">Value over time</span>' +
    '<div class="ranges">' +
    ['1W', '1M', '3M', 'ALL'].map(function (r) {
      return '<button class="' + (r === '1M' ? 'is-active' : '') + '">' + r + '</button>';
    }).join('') +
    '</div></div>' +
    '<div style="margin-top:auto">' +
    areaChart(path, CONFIG.brand.colors.yes, { height: 168 }) +
    '</div></div>' +
    '</div>' +

    '<div class="card" style="padding:6px 6px 10px">' +
    '<div class="tabs" style="padding:0 14px">' +
    '<button class="is-active">Positions (' + p.positions.length + ')</button>' +

    '</div>' +

    '<tbody>' + positionRows + '</tbody></table></div>' +
    '</div>' +

    '<h2 style="margin:30px 0 12px;font-size:16px;font-weight:600">Open orders</h2>' +
    '<div class="card" style="padding:14px 6px 10px">' +
    '<div class="tablewrap"><table class="table table--orders">' +
    '<thead><tr><th>Order</th><th>Side</th><th>Type</th><th class="num">Price</th>' +
    '<th class="num">Contracts</th><th class="num">Status</th><th class="num"></th></tr></thead>' +
    '<tbody>' + orderRows + '</tbody></table></div>' +

    '</div></div>' +

  );
}

/* ------------------------------------------------------------------- boot - */

var SCREENS = [
  { key: 'discovery', label: 'Discovery', render: screenDiscovery },
  { key: 'detail',    label: 'Market detail', render: screenDetail },
  { key: 'assistant', label: 'AI Assistant',
    render: function () { return screenDetail(0); } },
  { key: 'closeups',  label: 'Close-ups', render: screenCloseups },
  { key: 'portfolio', label: 'Portfolio', render: screenPortfolio }
];

/* The light values of every token a theme is allowed to move. Written first on
 * each theme apply, so switching dark -> light fully restores the baseline
 * instead of leaving dark values stranded on the root element. */
var LIGHT_BASE = {
  '--n-900': '#0B0E14', '--n-800': '#11171D', '--n-700': '#202C37',
  '--n-600': '#394960', '--n-500': '#62768A', '--n-400': '#99ADBD',
  '--n-300': '#C4D0D9', '--n-250': '#E5EBF5', '--n-200': '#ECEFF2',
  '--n-150': '#F3F5F7', '--n-100': '#F9FAFB', '--n-0': '#FFFFFF',

  '--ok-700': '#065F46', '--ok-500': '#10B981', '--ok-200': '#6EE7B7',
  '--ok-150': '#A7F3D0', '--ok-100': '#E3FBF0',

  '--no-700': '#961616', '--no-600': '#DC2626', '--no-500': '#EF4444',
  '--no-200': '#FCA5A5', '--no-150': '#FDBDBD',

  '--shadow-card': '0 1px 2px rgba(15,23,42,.04)',
  '--shadow-pop':  '0 10px 30px rgba(15,23,42,.08)',
  '--shadow-lift': '0 12px 34px rgba(15,23,42,.12)'
};

var THEME = 'light';

/* Below 880px the nav links, balance and CTA collapse behind the hamburger.
 * The state lives here rather than on the body alone so it survives the
 * re-render that a theme switch triggers. */
var NAV_OPEN = false;

function setNavOpen(open) {
  NAV_OPEN = open;
  document.body.classList[open ? 'add' : 'remove']('nav-open');
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav-toggle]'), function (el) {
    el.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
}

function themeNames() {
  var themes = CONFIG.brand.themes || {};
  return ['light', 'dark'].filter(function (name) { return themes[name]; });
}

function applyBrand() {
  var b = CONFIG.brand;
  document.documentElement.style.setProperty('--font', b.fontFamily);
  if (b.fontUrl) document.getElementById('brand-font').href = b.fontUrl;
  document.title = b.name + ' ' + b.product + ' · Mockups';
}

function applyTheme(name) {
  var b = CONFIG.brand;
  var themes = b.themes || {};
  var theme = themes[name] || themes.light || {};
  var root = document.documentElement.style;
  var c = b.colors;

  THEME = themes[name] ? name : 'light';

  // 1. reset to the light baseline
  Object.keys(LIGHT_BASE).forEach(function (token) {
    root.setProperty(token, LIGHT_BASE[token]);
  });

  // 2. brand identity, shared across themes
  root.setProperty('--brand', c.brand);
  root.setProperty('--brand-dark', c.brandDark);
  root.setProperty('--brand-light', c.brandLight);
  root.setProperty('--ok-500', c.yes);
  root.setProperty('--no-500', c.no);

  // 3. per-theme identity
  root.setProperty('--brand-ink', theme.brandInk || c.brand);
  root.setProperty('--brand-tint', theme.brandTint || LIGHT_BASE['--brand-tint'] || '#F4F4FF');
  root.setProperty('--brand-on', theme.brandOn || '#FFFFFF');

  // The assistant avatar keeps its own identity unless a brand restyles it.
  var avatar = (b.assistant && b.assistant.avatar) || {};
  root.setProperty('--ai-from', avatar.from || '#001F4D');
  root.setProperty('--ai-to', avatar.to || '#0A3170');
  // Set before theme.vars, so a theme can still name its own.
  // Dark lifts the dock above the brand's own card colour, whatever it is;
  // light is already at white, so the separation comes from the backdrop.
  root.setProperty('--ai-surface',
    THEME === 'dark' ? 'color-mix(in srgb, var(--n-0) 88%, #FFFFFF 12%)' : '#FFFFFF');
  root.setProperty('--ai-scrim',
    THEME === 'dark' ? 'rgba(4, 8, 15, .52)' : 'rgba(15, 23, 42, .18)');
  // Dark carries its separation in the surface itself, so it needs only a
  // soft ambient shadow; light carries all of it here.
  root.setProperty('--ai-lift',
    THEME === 'dark'
      ? '0 0 0 1px rgba(0, 0, 0, .5), 0 22px 48px -20px rgba(0, 0, 0, .75)'
      : '0 0 0 1px rgba(15, 23, 42, .05), 0 6px 14px -4px rgba(15, 23, 42, .20), 0 24px 50px -18px rgba(15, 23, 42, .40)');

  // 4. per-theme token overrides, last word
  if (theme.vars) {
    Object.keys(theme.vars).forEach(function (token) {
      root.setProperty(token, theme.vars[token]);
    });
  }

  document.documentElement.setAttribute('data-theme', THEME);

  try {
    window.localStorage.setItem('mockup-theme', THEME);
  } catch (e) {
    // file:// or blocked storage — the toggle still works for this session
  }
}

/* URL wins (so a screenshot can be pinned), then last choice, then the brand's
 * declared default. */
function initialTheme() {
  var requested = q('theme');
  if (requested && (CONFIG.brand.themes || {})[requested]) return requested;
  try {
    var saved = window.localStorage.getItem('mockup-theme');
    if (saved && (CONFIG.brand.themes || {})[saved]) return saved;
  } catch (e) { /* ignore */ }
  return CONFIG.brand.defaultTheme || 'light';
}

function render(key, scrollTop) {
  var screen = SCREENS.filter(function (s) { return s.key === key; })[0] || SCREENS[0];
  document.getElementById('app').innerHTML = screen.render();

  document.getElementById('mockTabs').innerHTML = SCREENS.map(function (s) {
    return '<button class="mockbar__tab' + (s.key === screen.key ? ' is-active' : '') +
      '" data-screen="' + s.key + '">' + s.label + '</button>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('[data-screen]'), function (el) {
    el.addEventListener('click', function () {
      var next = el.getAttribute('data-screen');
      history.replaceState(null, '', '?screen=' + next + (q('clean') ? '&clean=1' : ''));
      setNavOpen(false);
      render(next);
    });
  });

  // The toggle is rebuilt with each screen, so it is rebound here.
  Array.prototype.forEach.call(document.querySelectorAll('[data-theme-set]'), function (el) {
    el.addEventListener('click', function () {
      applyTheme(el.getAttribute('data-theme-set'));
      render(screen.key, false);
    });
  });

  // Same for the mobile nav: rebind the hamburger, close the drawer on a link
  // tap, and restore whatever state it was in before this render.
  Array.prototype.forEach.call(document.querySelectorAll('[data-nav-toggle]'), function (el) {
    el.addEventListener('click', function () { setNavOpen(!NAV_OPEN); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.nav__link'), function (el) {
    el.addEventListener('click', function () { setNavOpen(false); });
  });
  setNavOpen(NAV_OPEN);

  if (scrollTop !== false) window.scrollTo(0, 0);
}

if (q('clean')) document.body.classList.add('is-clean');
applyBrand();
applyTheme(initialTheme());
render(q('screen') || 'discovery');

</script>
</body>
</html>
